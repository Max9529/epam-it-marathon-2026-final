name: Final project quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/restaurant-frontend-app
    env:
      BACKEND_URL: https://example.invalid/develop
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/restaurant-frontend-app/package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx tsc -p tsconfig.spec.json --noEmit
      - run: npm run build
      - run: npm test -- --watch=false

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test backend/restaurant-backend-app/Tests/APIHandler.Tests.csproj --logger 'trx;LogFileName=backend.trx'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-results
          path: backend/restaurant-backend-app/Tests/TestResults/*.trx
          retention-days: 14
